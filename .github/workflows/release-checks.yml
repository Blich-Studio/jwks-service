name: Release checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_API_URL: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - run: bun run lint
